# Optional: run-docker.sh includes this file when AI_MCP_LAN_IP is set.
# These mappings supplement the localhost mappings in docker-compose.yml.
services:
  codex-mcp:
    ports:
      - target: 8080
        published: "8788"
        host_ip: ${AI_MCP_LAN_IP:?set the host private LAN IPv4 address}
        protocol: tcp
  claude-mcp:
    ports:
      - target: 8080
        published: "8789"
        host_ip: ${AI_MCP_LAN_IP:?set the host private LAN IPv4 address}
        protocol: tcp
