name: Affected bridge checks

on:
  push:
    paths:
      - '**/*.cs'
      - '**/*.csproj'
      - 'appsettings.json'
      - '**/Directory.*'
      - '**/NuGet.Config'
      - '**/nuget.config'
      - '**/packages.lock.json'
      - 'global.json'
      - 'scripts/affected-dotnet*.mjs'
      - '.github/workflows/dotnet-checks.yml'

permissions:
  contents: read

concurrency:
  group: dotnet-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  affected-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Select changed consumers
        id: selection
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: node scripts/affected-dotnet.mjs "$BEFORE_SHA" "$GITHUB_SHA"
      - name: Check changed affected-test selector
        if: steps.selection.outputs.selector_changed == 'true'
        run: node --test scripts/affected-dotnet.test.mjs
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Record selected source and execution configuration
        if: steps.selection.outputs.skip != 'true'
        run: |
          mkdir -p test-results
          {
            git rev-parse HEAD
            dotnet --info
            node --version
            printf 'Selection: %s\n' "$TEST_FILTER"
            printf '%s\n' 'Reason: relevant source, fixtures, dependencies or workflow changed in this push.'
            git ls-files -z -- '*.cs' '*.csproj' '*.props' '*.targets' 'global.json' '*NuGet.Config' '*nuget.config' '*packages.lock.json' 'appsettings.json' 'scripts/affected-dotnet*.mjs' '.github/workflows/dotnet-checks.yml' | xargs -0 sha256sum
          } > test-results/source-and-command.txt
      - if: steps.selection.outputs.skip != 'true'
        run: dotnet restore tests/AiMcpContainers.Tests.csproj
      - name: Run only affected consumers
        if: steps.selection.outputs.skip != 'true'
        run: |
          printf '%s\n' 'dotnet test tests/AiMcpContainers.Tests.csproj --no-restore --filter "$TEST_FILTER" --logger "trx;LogFileName=affected.trx" --results-directory test-results' >> test-results/source-and-command.txt
          dotnet test tests/AiMcpContainers.Tests.csproj --no-restore --filter "$TEST_FILTER" --logger 'trx;LogFileName=affected.trx' --results-directory test-results
      - name: Require executed tests and hash the result
        if: always() && steps.selection.outcome == 'success' && steps.selection.outputs.skip != 'true'
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, xml.etree.ElementTree as ET
          report = pathlib.Path('test-results/affected.trx')
          counters = ET.parse(report).find('.//{*}Counters').attrib
          assert int(counters['executed']) > 0 and int(counters['failed']) == 0, counters
          with open('test-results/source-and-command.txt', 'a') as evidence:
              evidence.write(str(counters) + '\n' + hashlib.sha256(report.read_bytes()).hexdigest() + '\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dotnet-evidence-${{ github.sha }}
          path: test-results/
